<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f3" />
    <title>ScreenHarbor</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const showBootstrapError = (reason) => {
          const root = document.getElementById("root");
          if (!root || root.childElementCount > 0) return;
          const message = reason instanceof Error ? reason.message : String(reason || "未知错误");
          document.title = `ScreenHarbor 启动失败：${message}`;
          root.innerHTML = `<main style="min-height:100vh;display:grid;place-items:center;padding:32px;color:#8d4e47;background:#faf8f3;font:14px/1.6 'Microsoft YaHei UI','Segoe UI',sans-serif;text-align:center"><div><strong>ScreenHarbor 界面启动失败</strong><br><span style="color:#737970">${message.replace(/[&<>\"']/g, (character) => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[character]))}</span></div></main>`;
        };
        window.addEventListener("error", (event) => showBootstrapError(event.error || event.message));
        window.addEventListener("unhandledrejection", (event) => showBootstrapError(event.reason));
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
