:root[data-theme=&quot;light&quot;] {
  color-scheme: light;

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h3,
h4,
h5,
h6 {

  line-height: 1.3;
}

b,
strong,
th {

}

code:not(pre code) {

  box-decoration-break: clone;

}

.table-responsive {

  overflow-x: auto;

}

.table {

  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  overflow-wrap: anywhere;

  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {

}

}

}

  gap: 12px;
  width: 100%;
  padding: 0;

.card {

  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;

    calc(100vw - 10px)

  color: var(--popover-foreground);
  background: var(--popover);

.viz-grid {

}

  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {

  font-weight: var(--font-weight-medium);

}

  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {

  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);

.text-muted {

}

.sr-only {

  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);

}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {

  gap: 2px 12px;

.btn,
.form-check-input,

a.btn {

.btn:not(:disabled):hover {

}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;frameflow-prototype&#x27;);
    const desktop = root.querySelector(&#x27;.ff-desktop&#x27;);
    const live = root.querySelector(&#x27;.ff-live&#x27;);
    const labels = {
      home:&#x27;主窗口默认态&#x27;, settings:&#x27;输出设置&#x27;, drawing:&#x27;绘制区域状态&#x27;, ready:&#x27;选区已就绪&#x27;, countdown:&#x27;倒计时状态&#x27;,
      recording:&#x27;正在录制&#x27;, paused:&#x27;录制已暂停&#x27;, processing:&#x27;预览视频已完成，主视频处理中&#x27;,
      done:&#x27;两个版本均已完成&#x27;, minimized:&#x27;FrameFlow 正在后台运行&#x27;, error:&#x27;保存路径不可用&#x27;
    };
    function setState(state) {
      desktop.dataset.currentState = state;
      root.querySelectorAll(&#x27;.ff-state-nav button&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.state === state)));
      live.textContent = labels[state];
    }
    root.querySelectorAll(&#x27;.ff-state-nav button&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setState(button.dataset.state)));
    root.querySelectorAll(&#x27;[data-action=&quot;start&quot;]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setState(&#x27;drawing&#x27;)));
    root.querySelectorAll(&#x27;[data-action=&quot;record&quot;]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setState(&#x27;countdown&#x27;)));
    root.querySelectorAll(&#x27;[data-action=&quot;pause&quot;]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setState(desktop.dataset.currentState === &#x27;paused&#x27; ? &#x27;recording&#x27; : &#x27;paused&#x27;)));
    root.querySelectorAll(&#x27;[data-action=&quot;finish&quot;]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setState(&#x27;processing&#x27;)));
    root.querySelectorAll(&#x27;[data-action=&quot;minimize&quot;]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setState(&#x27;minimized&#x27;)));
    root.querySelectorAll(&#x27;[data-action=&quot;open&quot;]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setState(&#x27;home&#x27;)));
    root.querySelectorAll(&#x27;[data-action=&quot;settings&quot;]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setState(&#x27;settings&#x27;)));

    const previewToggle = root.querySelector(&#x27;#ff-preview-toggle&#x27;);
    const coverToggle = root.querySelector(&#x27;#ff-cover-toggle&#x27;);
    const summary = root.querySelector(&#x27;.ff-output-summary strong&#x27;);
    function updateOutputSettings() {
      root.querySelector(&#x27;[data-dependent=&quot;preview&quot;]&#x27;).closest(&#x27;.ff-setting-group&#x27;).classList.toggle(&#x27;is-disabled&#x27;, !previewToggle.checked);
      const outputs = [&#x27;主视频&#x27;];
      if (previewToggle.checked) outputs.push(&#x27;预览&#x27;);
      if (coverToggle.checked) outputs.push(&#x27;封面&#x27;);
      summary.textContent = outputs.length === 1 ? &#x27;仅主视频&#x27; : outputs.join(&#x27;、&#x27;);
      live.textContent = summary.textContent;
    }
    previewToggle.addEventListener(&#x27;change&#x27;, updateOutputSettings);
    coverToggle.addEventListener(&#x27;change&#x27;, updateOutputSettings);
    updateOutputSettings();
  })();
