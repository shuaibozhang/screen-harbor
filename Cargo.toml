[workspace]
resolver = "2"
members = [
    "crates/frameflow-capture",
    "crates/frameflow-core",
    "crates/frameflow-media",
    "crates/frameflow-recorder",
    "crates/frameflow-windows",
    "src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
