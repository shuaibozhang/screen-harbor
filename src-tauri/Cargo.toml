[package]
name = "screenharbor"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "screenharbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
frameflow-capture = { path = "../crates/frameflow-capture" }
frameflow-core = { path = "../crates/frameflow-core" }
frameflow-media = { path = "../crates/frameflow-media" }
frameflow-recorder = { path = "../crates/frameflow-recorder" }
serde.workspace = true
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
frameflow-windows = { path = "../crates/frameflow-windows" }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
