[package]
name = "frameflow"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "frameflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
frameflow-capture = { path = "../crates/frameflow-capture" }
frameflow-core = { path = "../crates/frameflow-core" }
frameflow-recorder = { path = "../crates/frameflow-recorder" }
serde.workspace = true
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
frameflow-windows = { path = "../crates/frameflow-windows" }
