[package]
name = "frameflow-recorder"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
frameflow-capture = { path = "../frameflow-capture" }
frameflow-windows = { path = "../frameflow-windows" }
serde.workspace = true
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
] }

[dev-dependencies]
